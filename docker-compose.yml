version: '3.8'
services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: inventory_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://n8n:Admin2025Secure@postgres:5432/poleras_app?schema=public
      SECRET_KEY: cambia_esto_por_jwt_secreto_seguro
      CORS_ORIGIN: https://app.centralmoda.store
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    networks:
      - infra
      - app_network
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra
      - traefik.http.routers.backend.rule=Host(`api.centralmoda.store`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port=3000
      - traefik.http.routers.backend-http.rule=Host(`api.centralmoda.store`)
      - traefik.http.routers.backend-http.entrypoints=web
      - traefik.http.routers.backend-http.middlewares=redirect-https

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.centralmoda.store
    container_name: inventory_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - infra
      - app_network
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra
      - traefik.http.routers.frontend.rule=Host(`app.centralmoda.store`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=80
      - traefik.http.routers.frontend-http.rule=Host(`app.centralmoda.store`)
      - traefik.http.routers.frontend-http.entrypoints=web
      - traefik.http.routers.frontend-http.middlewares=redirect-https

networks:
  infra:
    external: true   # Red del stack n8n
  app_network:
    driver: bridge