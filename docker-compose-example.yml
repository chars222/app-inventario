services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: inventory_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: {port}
      DATABASE_URL: "CONECTION A POSTGRESQL"
      SECRET_KEY: "<SECRET_KEY>"
      CORS_ORIGIN: "CORS"
    command: sh -c "node dist/index.js"
    volumes:
      # Esta línea es la magia:
      # "Carpeta en Hetzner" : "Carpeta dentro de Docker"
      - ./datos/imagenes_subidas:/app/public/uploads
    networks:
      - infra
      - app_network
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra
      - traefik.http.routers.backend.rule=Host(`api_direction`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port={port}
      - traefik.http.routers.backend-http.rule=Host(`api.centralmoda.store`)
      - traefik.http.routers.backend-http.entrypoints=web
      - traefik.http.routers.backend-http.middlewares=redirect-https

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "api_direcciotion"
    container_name: inventory_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - infra
      - app_network
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra
      - traefik.http.routers.frontend.rule=Host(`app_direccition`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port={port}
      - traefik.http.routers.frontend-http.rule=Host(`app_direccition`)
      - traefik.http.routers.frontend-http.entrypoints=web
      - traefik.http.routers.frontend-http.middlewares=redirect-https

networks:
  infra:
    external: true   # Red del stack n8n
  app_network:
    driver: bridge
